  colsample_bytree: 0.9939474313125859
  max_depth: 8
  learning_rate: 0.33084695260252694
  gamma: 0.4536959510043049
optuna:
  n_trials: 50
  learning_rate_min: 0.01
  learning_rate_max: 0.4
  max_depth_min: 3
  max_depth_max: 8
  subsample_min: 0.7
  subsample_max: 1.0
  colsample_bytree_min: 0.7
  colsample_bytree_max: 1.0
  gamma_min: 0.0
  gamma_max: 2.0
  scale_pos_weight_min: 1.0
  scale_pos_weight_max: 10.0
