data:
  raw_path: Data/Raw/train.parquet
  processed_path: Data/Processed/train_ready.parquet
  test_size: 0.2
  random_state: 42
train:
  num_boost_round: 1000
  early_stopping_rounds: 30
xgboost_params:
  objective: binary:logistic
  tree_method: hist
  eval_metric: aucpr
